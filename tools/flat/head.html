<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Glasses Mark 1 — step-by-step 3D build</title>
<meta name="description" content="An animated, step-by-step 3D assembly manual for Music Glasses Mark 1: tortoiseshell frames that look normal from the front, hidden pods, stereo micro-speakers, a call mic, touch inlays and a QT Py ESP32 Pico Bluetooth A2DP/HFP/BLE core.">
<meta name="theme-color" content="#16120e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23c9967a%22/%3E%3Cpath d=%22M10 28h18v10a6 6 0 0 1-6 6h-6a6 6 0 0 1-6-6zM36 28h18v10a6 6 0 0 1-6 6h-6a6 6 0 0 1-6-6zM28 31h8%22 fill=%22none%22 stroke=%22%23141418%22 stroke-width=%224%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--amber:#f4a93b;--amber2:#ffbf5a;--ink:#141418;--panel:rgba(24,24,30,.86);--panel2:rgba(30,30,38,.92);--line:rgba(255,255,255,.08);--txt:#f2efe9;--mut:#a4a2a8;
  --sans:"Outfit",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1410;color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body.drawing{background:#fff}
button{font:inherit;color:inherit;cursor:pointer}
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;outline:none}
#ui-labels{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;padding:5px 10px 5px 8px;border-radius:8px;background:rgba(28,28,34,.92);color:#fff;font:600 12.5px/1 var(--sans);white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.25);transform:translate(14px,-50%);transition:opacity .25s;will-change:transform}
.lbl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber);flex:0 0 auto;box-shadow:0 0 0 3px rgba(244,169,59,.18)}
.lbl code{font:500 11.5px/1 var(--mono);color:#9fc2ff;letter-spacing:.02em}
.lbl .n{font:500 11.5px/1 var(--mono);color:#cfcfd4}
.lbl.joint::before{background:#ff7a59}
.lbl.alt::before{background:#7dd3fc}
.lbl.dot{padding:0;background:none;box-shadow:none}.lbl.dot::before{width:9px;height:9px}
body.drawing .lbl{background:rgba(255,255,255,.96);color:#111;border:1px solid #ddd}body.drawing .lbl code{color:#2456b8}body.drawing .lbl .n{color:#555}
/* ---------- left panel ---------- */
.pl{position:fixed;left:18px;top:14px;width:272px;z-index:10;display:flex;flex-direction:column;gap:9px;max-height:calc(100vh - 28px)}
.kicker{font:800 17px/1 var(--sans);letter-spacing:.01em;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.brand{margin:-2px 0 0;font:900 38px/0.95 var(--sans);color:var(--amber);letter-spacing:.01em;text-shadow:0 2px 14px rgba(0,0,0,.25)}
.intro{margin:2px 0 2px;font:400 12px/1.45 var(--sans);color:rgba(255,255,255,.88);text-shadow:0 1px 6px rgba(0,0,0,.5)}
.ctrs{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:6px}
.ctr{background:var(--panel);border-radius:9px;padding:7px 9px 6px;backdrop-filter:blur(6px)}
.ctr span{display:block;font:500 9px/1 var(--mono);letter-spacing:.08em;color:#bdbbc2;text-transform:uppercase}
.ctr b{font:700 19px/1.25 var(--sans);color:var(--amber)} .ctr i{font:500 10px var(--mono);color:#8d8b93;font-style:normal;margin-left:1px}
.card{background:var(--panel);border-radius:12px;padding:11px 13px 12px;backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.st-title{font:700 10.5px/1.35 var(--mono);color:var(--amber);letter-spacing:.09em;text-transform:uppercase;margin-bottom:6px}
.st-body{font:400 13px/1.5 var(--sans);color:#f3f1ec}.st-body b{color:#fff;font-weight:700}
.st-prog{margin-top:6px;font:500 11.5px/1.3 var(--mono);color:#d8d6dc}.st-prog b{color:var(--amber)}
.mcard{padding:9px 9px 9px}
.mc-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px}
.mc-head span{font:500 10px/1 var(--mono);letter-spacing:.09em;color:#c9c7ce}.mc-head span b{color:#fff}
.mc-head button{background:rgba(255,255,255,.09);border:0;border-radius:7px;padding:5px 9px;font:500 11.5px/1 var(--sans);color:#fff;display:flex;gap:6px;align-items:center}
.mc-head button:hover{background:rgba(255,255,255,.17)}
.mc-img{background:#fff;border-radius:9px;overflow:hidden;aspect-ratio:480/330;cursor:zoom-in}
.mc-img svg{display:block;width:100%;height:100%}
.ico{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* ---------- right panel ---------- */
.pr{position:fixed;right:18px;top:14px;width:300px;z-index:10;background:var(--panel2);border-radius:14px;padding:11px 12px 12px;backdrop-filter:blur(10px);box-shadow:0 10px 36px rgba(0,0,0,.28)}
.pr-head,.tl-head{display:flex;justify-content:space-between;align-items:center;font:500 9.5px/1 var(--mono);letter-spacing:.1em;color:#bdbbc2}
.tl-head{margin-top:10px}.hint{letter-spacing:.04em;color:#8f8d95}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:9px;padding:3px;gap:3px;margin-top:8px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 8px;font:600 12px/1 var(--sans);color:#e8e6ea}
.seg button.on{background:#f4f4f6;color:#16161a}
.pr-row{display:flex;align-items:center;gap:8px;margin-top:9px}
.sq{width:30px;height:30px;border-radius:8px;border:0;background:rgba(255,255,255,.07);font:500 17px/1 var(--sans);display:grid;place-items:center;flex:0 0 auto}
.sq:hover{background:rgba(255,255,255,.16)}
.pr-title{flex:1;min-width:0}.pr-title b{display:block;font:700 14px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pr-title small{font:400 10px/1.4 var(--mono);color:#a9a7af}
.play{width:34px;height:34px;border-radius:50%;border:0;background:#4a3820;display:grid;place-items:center;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(244,169,59,.35)}
.play svg{width:15px;height:15px;fill:var(--amber)} .play:hover{background:#5d4626}
.ticks{position:relative;height:14px;margin:6px 6px 0}
.ticks button{position:absolute;top:0;transform:translateX(-50%);border:0;background:none;padding:0 2px;font:500 9px/14px var(--mono);color:#8f8d95}
.ticks button.cur{color:#fff;font-weight:700}.ticks button:hover{color:var(--amber)}
.track{position:relative;height:18px;margin:0 6px;cursor:pointer;touch-action:none}
.track::before{content:"";position:absolute;left:0;right:0;top:8px;height:3px;border-radius:2px;background:rgba(255,255,255,.14)}
.fill{position:absolute;left:0;top:8px;height:3px;border-radius:2px;background:linear-gradient(90deg,#c9822a,var(--amber))}
.knob{position:absolute;top:3px;width:13px;height:13px;border-radius:50%;background:#f4f4f6;transform:translateX(-50%);box-shadow:0 1px 6px rgba(0,0,0,.4)}
.tickmarks i{position:absolute;top:14px;width:1px;height:4px;background:rgba(255,255,255,.25)}
.pr-row2{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.pr-row2 .seg{margin-top:0;flex:0 0 auto}.pr-row2 .seg button{padding:7px 12px}
.icons{display:flex;gap:6px}.icons button{width:30px;height:30px;border:0;border-radius:8px;background:rgba(255,255,255,.07);display:grid;place-items:center;color:#e8e6ea}
.icons button:hover{background:rgba(255,255,255,.16)} body.freecam #ui-iCam{background:var(--amber);color:#16161a}
.corner{position:fixed;right:18px;bottom:16px;z-index:9;display:flex;gap:8px}
.corner button,.corner a{border:0;border-radius:9px;background:var(--panel2);padding:8px 12px;font:600 12px/1 var(--sans);color:#fff;text-decoration:none;display:flex;align-items:center;gap:7px;backdrop-filter:blur(8px)}
.corner button:hover,.corner a:hover{background:#2e2e38}
#ui-noGL{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;max-width:420px;text-align:center;color:#ddd;font-size:14px;background:rgba(0,0,0,.5);padding:16px 20px;border-radius:12px}
#ui-loading{position:fixed;inset:0;display:grid;place-items:center;z-index:3;color:#d9cbb8;font:500 13px var(--mono);letter-spacing:.08em;pointer-events:none}
body.drawing .pl .kicker,body.drawing .intro{color:#111;text-shadow:none}body.drawing .brand{color:#111;text-shadow:none}
body.drawing .ctr,body.drawing .card{background:rgba(255,255,255,.94);border:1px solid #e9e9ee;box-shadow:0 6px 24px rgba(0,0,0,.06)}
body.drawing .ctr span{color:#555}body.drawing .ctr i{color:#888}body.drawing .st-body{color:#222}body.drawing .st-body b{color:#000}body.drawing .st-prog{color:#333}
body.drawing .mc-head span{color:#555}body.drawing .mc-head span b{color:#111}body.drawing .mc-head button{background:#efeff2;color:#111}
body.drawing .mc-img{border:1px solid #eee}
/* ---------- manual viewer ---------- */
.mv{position:fixed;left:0;top:0;bottom:0;width:min(44vw,640px);z-index:30;background:#fbfaf7;color:#111;transform:translateX(-102%);transition:transform .45s cubic-bezier(.65,0,.35,1);display:flex;flex-direction:column;box-shadow:12px 0 50px rgba(0,0,0,.35)}
body.manual-open .mv{transform:none} body.manual-open .pl{opacity:0;pointer-events:none;transform:translateX(-30px)}
.pl{transition:opacity .35s,transform .35s}
.mv-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #e6e3dc;font:600 13px var(--sans)}
.mv-head small{font:500 10px var(--mono);color:#777;letter-spacing:.1em;display:block}
.mv-head label{font:500 11px var(--sans);color:#555;display:flex;gap:5px;align-items:center}
.mv-head button{border:0;background:#efede7;border-radius:8px;width:30px;height:30px;font-size:18px}
#ui-mvPage{flex:1;overflow:auto;padding:16px 26px 30px;font:400 14px/1.55 var(--sans)}
#ui-mvPage h2{margin:0 0 10px;font:800 22px/1.2 var(--sans)} #ui-mvPage h3{font:700 14px var(--sans);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.06em}
#ui-mvPage .cnt{font:800 13px var(--mono);margin-left:6px}
.pg-num{font:900 46px/1 var(--sans);margin:2px 0 6px}
.pg-art{border:1px solid #e3e0d8;border-radius:10px;overflow:hidden;background:#fff}.pg-art svg{display:block;width:100%;height:auto}
.pg-wire{border:1px solid #e3e0d8;border-radius:10px;background:#fff;padding:6px}.pg-wire svg{display:block;width:100%;height:auto}
.pg-wire svg .flow{stroke-dasharray:10 8;animation:flow 1.1s linear infinite;stroke:#fff}@keyframes flow{to{stroke-dashoffset:-36}}
.lead{font-size:15px}.small{font-size:12px;color:#555}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:#1d1d22;color:#fff;border-radius:7px;padding:4px 9px;font:600 11.5px var(--sans)}
.pg-play{border:0;background:#1d1d22;color:#fff;border-radius:9px;padding:9px 14px;font:600 13px var(--sans)}
.pg-toc{padding:0;list-style:none;columns:2;column-gap:20px}.pg-toc li{display:flex;justify-content:space-between;border-bottom:1px dotted #ccc;padding:4px 0;break-inside:avoid;font-size:13px}.pg-toc a{color:#111;text-decoration:none}.pg-toc a:hover{text-decoration:underline}.pg-toc span{font:500 11px var(--mono);color:#777}
.pg-table{width:100%;border-collapse:collapse;font-size:12px}.pg-table td,.pg-table th{border-bottom:1px solid #e6e3dc;padding:6px 6px;text-align:left;vertical-align:top}.pg-table small{color:#666}.pg-table a{color:#1d4ed8}
.pg-links{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pg-links button{border:1px solid #ddd;background:#fff;border-radius:9px;padding:10px;text-align:left;font:600 13px var(--sans)}.pg-links button:hover{border-color:#111}
.mv-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid #e6e3dc;font:500 12px var(--mono)}
.mv-foot button{border:0;background:#1d1d22;color:#fff;border-radius:50%;width:40px;height:40px;font-size:20px}
/* ---------- docs drawer ---------- */
.docs{position:fixed;top:0;right:0;bottom:0;width:min(1060px,100vw);z-index:40;background:#080c14;transform:translateX(104%);transition:transform .45s cubic-bezier(.65,0,.35,1);display:flex;flex-direction:column;box-shadow:-14px 0 60px rgba(0,0,0,.5)}
body.docs-open .docs{transform:none}
.docs-head{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #22304d;background:#0c1424;color:#e6edf7;font:600 14px var(--sans)}
.docs-head .r{display:flex;gap:10px;align-items:center;font:500 12px var(--sans);color:#93a4c3}
.docs-head button.x{border:0;background:#15213a;color:#e6edf7;border-radius:8px;width:32px;height:32px;font-size:18px}
.docs-body{flex:1;display:flex;min-height:0}
#ui-docsNav{width:210px;flex:0 0 210px;overflow:auto;border-right:1px solid #22304d;padding:10px 8px;background:#0a101c}
#ui-docsNav a{display:block;color:#93a4c3;text-decoration:none;font:500 13px/1.3 var(--sans);padding:6px 10px;border-radius:7px}#ui-docsNav a:hover{background:#13203a;color:#e6edf7}
#ui-docsNav .grp{font:600 10px var(--mono);letter-spacing:.12em;color:#5d6f92;margin:12px 10px 4px;text-transform:uppercase}
#docs{flex:1;overflow:auto;padding:22px clamp(14px,3vw,36px) 80px}
.help{position:fixed;right:330px;top:14px;z-index:20;width:290px;background:var(--panel2);border-radius:12px;padding:12px 14px;font:400 12.5px/1.5 var(--sans);display:none;backdrop-filter:blur(10px)}
.help.show{display:block}.help b{color:var(--amber)}.help kbd{font:500 11px var(--mono);background:rgba(255,255,255,.1);border-radius:4px;padding:1px 5px}
.help button{float:right;border:0;background:none;color:#aaa;font-size:16px}
.toggle-left{display:none}
/* ---------- responsive ---------- */
@media (max-height:700px) and (min-width:821px){.intro{display:none}.mc-img{aspect-ratio:480/290}}
@media (max-width:1100px) and (min-width:821px){.pl{width:240px}.pr{width:270px}.help{right:300px}}
@media (max-width:820px){
  .pl{left:10px;right:10px;top:8px;width:auto;gap:6px}
  .kicker{font-size:12px}.brand{font-size:26px}.intro,.mcard{display:none}
  .ctrs{position:absolute;right:0;top:0;width:58%;gap:4px}.ctr{padding:5px 6px}.ctr b{font-size:15px}.ctr span{font-size:7.5px}
  .card.step{padding:8px 10px}.st-body{font-size:12px;max-height:5.6em;overflow:auto}
  body.left-collapsed .card.step .st-body{display:none}
  .toggle-left{display:inline-block;position:absolute;right:8px;top:6px;border:0;background:none;color:#aaa;font-size:14px}
  .pr{left:8px;right:8px;top:auto;bottom:8px;width:auto;padding:8px 10px 10px}
  .pr-head,.seg.piece{display:none}.pr-row{margin-top:0}
  .corner{bottom:auto;top:auto;display:none}
  .mv{width:100vw}.help{right:8px;left:8px;width:auto;top:auto;bottom:200px}
  #ui-docsNav{display:none}
  .lbl{font-size:11px;padding:4px 8px}
}
/* ---- Now playing while you build (Spotify embeds, needs internet) ---- */
.mus{position:fixed;right:150px;bottom:16px;z-index:11;font:600 12px/1 var(--sans);color:#fff}
.mus-pill{border:0;border-radius:9px;background:var(--panel2);padding:8px 12px;font:600 12px/1 var(--sans);color:#fff;display:flex;align-items:center;gap:7px;backdrop-filter:blur(8px);cursor:pointer}
.mus-pill:hover{background:#2e2e38}.mus-pill .eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.mus-pill .eq i{width:2px;background:#1ed760;border-radius:1px;height:4px}.mus.open .mus-pill .eq i{animation:musb 1s ease-in-out infinite}
.mus-pill .eq i:nth-child(2){animation-delay:.2s}.mus-pill .eq i:nth-child(3){animation-delay:.4s}
@keyframes musb{0%,100%{height:3px}50%{height:11px}}
.mus-card{position:absolute;right:-132px;bottom:42px;width:320px;background:var(--panel2);border-radius:14px;padding:11px 12px 12px;backdrop-filter:blur(10px);box-shadow:0 10px 36px rgba(0,0,0,.28);display:none}
.mus.open .mus-card{display:block}
.mus-card .seg{flex-wrap:wrap}.mus-card .seg button{flex:1 1 40%;padding:6px 6px;cursor:pointer}
.mus-frame{margin-top:9px;border-radius:12px;overflow:hidden;background:#121216;height:352px}
.mus-frame iframe{display:block;width:100%;height:100%;border:0}
.mus-note{margin-top:7px;font:400 9.5px/1.4 var(--mono);color:#a9a7af}.mus-note a{color:#cfcdd4}
@media (max-height:760px) and (min-width:821px){.mus-frame{height:232px}}
@media (max-width:820px){.mus-card .pr-head{display:flex}.mus{right:8px;bottom:calc(var(--prh,150px) + 16px)}.mus-card{right:0;width:min(320px,calc(100vw - 16px))}.mus-frame{height:232px}}
@media (prefers-reduced-motion:reduce){.mv,.docs{transition:none}}
</style>

__DOCS_CSS__
</style>
